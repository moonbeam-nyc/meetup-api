apiVersion: apps/v1
kind: Deployment
metadata:
  name: meetup-api
  namespace: meetup-api
  labels:
    app: meetup-api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: meetup-api
  template:
    metadata:
      labels:
        app: meetup-api
    spec:
      containers:
      - name: meetup-api
        image: ghcr.io/moonbeam-nyc/meetup-api:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        env:
        - name: PORT
          value: "3000"
        - name: MEETUP_ORG_URL
          valueFrom:
            configMapKeyRef:
              name: meetup-api-config
              key: meetup-org-url
        - name: REFRESH_INTERVAL_HOURS
          valueFrom:
            configMapKeyRef:
              name: meetup-api-config
              key: refresh-interval-hours
              optional: true
        startupProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 10
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 0
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 2
        resources:
          requests:
            cpu: "10m"
            memory: "20Mi"
          limits:
            cpu: "1000m"
            memory: "2Gi"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: meetup-api-config
  namespace: meetup-api
  labels:
    app: meetup-api
data:
  # Set your Meetup.com organization URL here
  meetup-org-url: "https://www.meetup.com/astoria-tech-meetup"
  refresh-interval-hours: "1"
